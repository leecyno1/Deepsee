name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOFLAGS: "-tags=sqlite_fts5"

jobs:
  build-macos:
    name: Build macOS (amd64, arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clean Workspace Build Outputs
        shell: bash
        run: rm -rf dist release

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true

      - name: Run Tests And Static Checks
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go test -race ./...
          go vet ./...

      - name: Run Vulnerability Scan
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Build Binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          chmod 755 scripts/build_chatlog_binary.sh scripts/verify_chatlog_binary.sh
          for arch in amd64 arm64; do
            CHATLOG_VERSION="${GITHUB_REF_NAME}" GOOS=darwin GOARCH="${arch}" \
              scripts/build_chatlog_binary.sh "dist/chatlog-darwin-${arch}"
          done

      - name: Smoke Test macOS Binaries
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            binary="dist/chatlog-darwin-${arch}"
            chmod 755 "${binary}"
            test -x "${binary}"
            "${binary}" --help >/dev/null
          done

      - name: Package Archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          short_sha="${GITHUB_SHA::7}"
          for arch in amd64 arm64; do
            chmod 755 "dist/chatlog-darwin-${arch}"
            package_dir="dist/package-${arch}"
            packaged_binary="${package_dir}/chatlog-darwin-${arch}"
            launcher="${package_dir}/start-chatlog.command"
            mkdir -p "${package_dir}"
            cp "dist/chatlog-darwin-${arch}" "${packaged_binary}"
            cat > "${launcher}" <<EOF
          #!/bin/zsh
          set -euo pipefail

          script_dir="\$(cd -- "\$(dirname -- "\$0")" && pwd)"
          binary="\${script_dir}/chatlog-darwin-${arch}"

          chmod 755 "\${binary}"
          xattr -d com.apple.quarantine "\${binary}" 2>/dev/null || true
          exec "\${binary}" "\$@"
          EOF
            chmod 755 "${launcher}"
            /bin/zsh -n "${launcher}"
            "${launcher}" --help >/dev/null
            archive="release/chatlog_${short_sha}_darwin_${arch}.zip"
            /usr/bin/zip -j "${archive}" \
              "${packaged_binary}" \
              "${launcher}" \
              LICENSE \
              README.md
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-macos
          path: |
            dist/chatlog-darwin-*
            release/*.zip

  publish:
    name: Publish Release Assets
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - build-macos
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Collect Files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          find release-assets -type f \( -name "*.zip" -o -name "chatlog-darwin-*" \) -exec cp {} publish/ \;
          for file in \
            chatlog-darwin-amd64 \
            chatlog-darwin-arm64; do
            test -s "publish/${file}"
          done
          for pattern in \
            'chatlog_*_darwin_amd64.zip' \
            'chatlog_*_darwin_arm64.zip'; do
            matches=(publish/${pattern})
            test "${#matches[@]}" -eq 1
            test -s "${matches[0]}"
          done
          ls -lah publish

      - name: Publish Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          body: "Auto build for `${{ github.sha }}` from `${{ github.ref_name }}`."
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: publish/*

      - name: Remove Superseded Release Assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" --jq .id)"
          while IFS=$'\t' read -r asset_id asset_name; do
            [[ -n "${asset_id}" && -n "${asset_name}" ]] || continue
            if [[ ! -f "publish/${asset_name}" ]]; then
              gh api \
                --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done < <(
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              --jq '.[] | [.id, .name] | @tsv'
          )

      - name: Move Latest Tag After Successful Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
            -f sha="${GITHUB_SHA}" \
            -F force=true
