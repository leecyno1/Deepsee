server:
  host: "127.0.0.1"
  port: 8081
  debug: false

logging:
  level: INFO

pipeline:
  maas:
    enabled: false

  ocr_api:
    api_host: 127.0.0.1
    api_port: 8080
    api_path: /chat/completions
    api_mode: openai
    model: mlx-community/GLM-OCR-bf16
    verify_ssl: false
    connect_timeout: 30
    request_timeout: 180
    retry_max_attempts: 3
    retry_backoff_base_seconds: 0.5
    retry_backoff_max_seconds: 8.0
    connection_pool_size: 8

  layout:
    model_dir: PaddlePaddle/PP-DocLayoutV3_safetensors
    device: cpu
    batch_size: 1
    workers: 1
    threshold: 0.3
    use_polygon: false

  max_workers: 4
  page_maxsize: 16
  region_maxsize: 128

  page_loader:
    max_tokens: 8192
    temperature: 0.0
    top_p: 0.00001
    top_k: 1
    repetition_penalty: 1.1
    image_expect_length: 6144
    image_format: JPEG
    min_pixels: 12544
    max_pixels: 71372800
    task_prompt_mapping:
      text: "Text Recognition:"
      table: "Table Recognition:"
      formula: "Formula Recognition:"

  result_formatter:
    output_format: both
    enable_merge_formula_numbers: true
    enable_merge_text_blocks: true
    enable_format_bullet_points: true
